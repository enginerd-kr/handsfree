<text x="18.0" y="153.0" fill="#e4e6ea" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Hello.</text>
<text x="18.0" y="172.0" fill="#e4e6ea" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  What are we working on today?</text>
<text x="18.0" y="210.0" fill="#e4e6ea" textLength="655.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Write it as you would say it; handsfree plans it and picks the agent for it.</text>
<text x="18.0" y="229.0" fill="#e4e6ea" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  Try a line like one of these.</text>
<text x="34.8" y="267.0" fill="rgb(217,217,217)" textLength="193.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"fix the failing tests"</text>
<text x="228.0" y="267.0" fill="rgb(155,155,155)" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">                // the planner picks who takes it</text>
<text x="34.8" y="286.0" fill="rgb(217,217,217)" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"@orchestrator plan this out"</text>
<text x="278.4" y="286.0" fill="rgb(155,155,155)" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">          // call the planner yourself</text>
<text x="34.8" y="305.0" fill="rgb(217,217,217)" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"</text>
<text x="43.2" y="305.0" fill="rgb(217,119,87)" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">@claude</text>
<text x="102.0" y="305.0" fill="rgb(217,217,217)" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> summarise this file"</text>
<text x="278.4" y="305.0" fill="rgb(155,155,155)" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">          // straight to an agent</text>
<text x="34.8" y="324.0" fill="rgb(217,217,217)" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">"</text>
<text x="43.2" y="324.0" fill="rgb(111,194,168)" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">@codex:gpt-5.6</text>
